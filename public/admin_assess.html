<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Detail - NU Peduli</title>
    
    <!-- Dependencies -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --nu-green: #006432; --nu-gold: #c5a059; --bg: #f4f7f6; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background-color: var(--bg); padding-bottom: 80px; }
        
        header { background: var(--nu-green); color: white; padding: 15px; text-align: center; border-bottom: 3px solid var(--nu-gold); position: sticky; top: 0; z-index: 1000; }
        .container { padding: 15px; max-width: 700px; margin: auto; }
        
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .section-title { background: #e8f5e9; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; color: var(--nu-green); margin: 25px 0 10px 0; border-left: 5px solid var(--nu-gold); display: flex; align-items: center; gap: 8px; }
        
        label { display: block; font-size: 0.75rem; font-weight: 600; margin-top: 12px; color: #444; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin-top: 5px; box-sizing: border-box; font-family: inherit; font-size: 0.9rem; }
        
        /* Grid Layout untuk Angka */
        .grid-numbers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

        .btn-submit { width: 100%; padding: 16px; background: var(--nu-green); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 30px; box-shadow: 0 4px 12px rgba(0,100,50,0.2); transition: 0.3s; }
        .btn-submit:active { transform: scale(0.98); background: #004d26; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; padding: 10px 0; border-top: 1px solid #ddd; z-index: 2000; }
        .nav-item { flex: 1; text-align: center; color: #94a3b8; text-decoration: none; font-size: 0.6rem; font-weight: 600; }
        .nav-item.active { color: var(--nu-green); }
        .nav-item i { font-size: 1.2rem; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

<header><h1 style="margin:0; font-size:1.1rem;">FORM ASSESSMENT DETAIL</h1></header>

<div class="container">
    <div class="card">
        <label>Pilih Laporan Masuk / Bencana</label>
        <select id="assess-report-id" onchange="autoFill(this.value)">
            <option value="">-- Pilih Kejadian --</option>
        </select>

        <!-- SEKSI I: IDENTITAS -->
        <div class="section-title"><i class="fas fa-map-marker-alt"></i> I. IDENTITAS & LOKASI</div>
        
        <label>Jenis Bencana</label>
        <select id="in-tipe">
            <option>Banjir</option><option>Longsor</option><option>Gempa Bumi</option>
            <option>Cuaca Ekstrem</option><option>Letusan Gunung Api</option><option>Kekeringan</option>
        </select>

        <label>Wilayah (Jawa Tengah)</label>
        <div class="grid-3">
            <select id="in-kab" onchange="loadKecamatan(this.value)"><option value="">Kabupaten</option></select>
            <select id="in-kec" onchange="loadDesa(this.value)"><option value="">Kecamatan</option></select>
            <select id="in-desa"><option value="">Desa</option></select>
        </div>

        <div class="grid-2">
            <div><label>Tanggal Kejadian</label><input type="date" id="in-tgl"></div>
            <div><label>Waktu Kejadian</label><input type="time" id="in-jam"></div>
        </div>

        <label>Koordinat (Lat, Long)</label>
        <div class="grid-2">
            <input type="text" id="in-lat" placeholder="Latitude">
            <input type="text" id="in-lng" placeholder="Longitude">
        </div>

        <!-- SEKSI II: NARASI -->
        <div class="section-title"><i class="fas fa-edit"></i> II. NARASI SITUASI</div>
        <label>Kondisi Mutakhir</label><textarea id="in-kondisi" rows="3" placeholder="Gambarkan situasi saat ini..."></textarea>
        <label>Upaya Penanganan</label><textarea id="in-upaya" rows="3" placeholder="Apa yang sudah dilakukan..."></textarea>
        <label>Sebaran Dampak</label><textarea id="in-sebaran" rows="3" placeholder="Wilayah mana saja yang terdampak..."></textarea>

        <!-- SEKSI III: KEBUTUHAN -->
        <div class="section-title"><i class="fas fa-hand-holding-heart"></i> III. KEBUTUHAN MENDESAK</div>
        <label>Dana (Essay)</label><input type="text" id="k-dana">
        <label>Relawan (Essay)</label><input type="text" id="k-relawan">
        <label>Logistik (Essay)</label><input type="text" id="k-logistik">
        <label>Peralatan (Essay)</label><input type="text" id="k-peralatan">
        <label>Medis (Essay)</label><input type="text" id="k-medis">

        <!-- SEKSI IV: DAMPAK JIWA & RUMAH -->
        <div class="section-title"><i class="fas fa-users"></i> IV. DAMPAK JIWA & RUMAH</div>
        <label style="color:var(--nu-green)">Manusia (Jiwa)</label>
        <div class="grid-3">
            <input type="number" id="d-meninggal" placeholder="Meninggal">
            <input type="number" id="d-hilang" placeholder="Hilang">
            <input type="number" id="d-sakit" placeholder="Sakit/Luka">
        </div>
        <div class="grid-2" style="margin-top:8px">
            <input type="number" id="d-pengungsi" placeholder="Mengungsi">
            <input type="number" id="d-terdampak" placeholder="Terdampak (Jiwa)">
        </div>

        <label style="color:var(--nu-green); margin-top:15px;">Rumah Tinggal (Unit)</label>
        <div class="grid-3">
            <input type="number" id="r-berat" placeholder="Rusak Berat">
            <input type="number" id="r-sedang" placeholder="Sedang">
            <input type="number" id="r-ringan" placeholder="Ringan">
        </div>

        <!-- SEKSI V: FASILITAS UMUM & VITAL -->
        <div class="section-title"><i class="fas fa-building"></i> V. FASUM & SARANA VITAL</div>
        <div class="grid-numbers">
            <div><label>Faskes</label><input type="number" id="f-faskes"></div>
            <div><label>Ibadah</label><input type="number" id="f-ibadah"></div>
            <div><label>Sekolah</label><input type="number" id="f-sekolah"></div>
            <div><label>Kantor</label><input type="number" id="f-kantor"></div>
            <div><label>Pasar</label><input type="number" id="f-pasar"></div>
        </div>

        <label style="color:var(--nu-green); margin-top:15px;">Sarana Vital & Lingkungan</label>
        <div class="grid-numbers">
            <div><label>Air Bersih</label><input type="number" id="v-air"></div>
            <div><label>Listrik</label><input type="number" id="v-listrik"></div>
            <div><label>Telekomunikasi</label><input type="number" id="v-telekom"></div>
            <div><label>Irigasi</label><input type="number" id="v-irigasi"></div>
            <div><label>Jalan/Jembatan</label><input type="number" id="v-jalan"></div>
            <div><label>SPBU</label><input type="number" id="v-spbu"></div>
            <div><label>Sawah (Ha)</label><input type="number" id="l-sawah"></div>
            <div><label>Ternak (Ekor)</label><input type="number" id="l-ternak"></div>
        </div>

        <button class="btn-submit" onclick="saveFullAssessment()">SIMPAN & TERBITKAN LAPORAN</button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="admin.html" class="nav-item"><i class="fas fa-chart-line"></i>Dash</a>
    <a href="admin_verify.html" class="nav-item"><i class="fas fa-inbox"></i>Verify</a>
    <a href="admin_assess.html" class="nav-item active"><i class="fas fa-file-invoice"></i>Assess</a>
    <a href="admin_instruksi.html" class="nav-item"><i class="fas fa-signature"></i>Instruksi</a>
    <a href="admin_action.html" class="nav-item"><i class="fas fa-hand-holding-heart"></i>Action</a>
</nav>

<script>
   const API_URL = window.location.origin; 
    let allData = [];

    // 1. Inisialisasi Data
    async function start() {
        const userData = JSON.parse(localStorage.getItem('userData'));
        if(!userData) { window.location.href = 'login.html'; return; }
        
        const res = await fetch(`${API_URL}/api/reports/admin?region=${userData.region}&role=${userData.role}`);
        allData = await res.json();
        
        // Isi dropdown laporan
        const approved = allData.filter(r => r.is_approved);
        document.getElementById('assess-report-id').innerHTML = '<option value="">-- Pilih Kejadian --</option>' + 
            approved.map(r => `<option value="${r.id}">${r.disaster_type} - ${r.city_district} (${new Date(r.created_at).toLocaleDateString()})</option>`).join('');
        
        loadKabupaten();
    }

    // 2. Geolocation API (Jawa Tengah)
    async function loadKabupaten() {
        const res = await fetch(`https://www.emsifa.com/api-wilayah-indonesia/api/regencies/33.json`);
        const data = await res.json();
        document.getElementById('in-kab').innerHTML = '<option value="">Kabupaten</option>' + data.map(k => `<option value="${k.id}" data-name="${k.name}">${k.name}</option>`).join('');
    }
    async function loadKecamatan(id) {
        const res = await fetch(`https://www.emsifa.com/api-wilayah-indonesia/api/districts/${id}.json`);
        const data = await res.json();
        document.getElementById('in-kec').innerHTML = data.map(k => `<option value="${k.id}" data-name="${k.name}">${k.name}</option>`).join('');
    }
    async function loadDesa(id) {
        const res = await fetch(`https://www.emsifa.com/api-wilayah-indonesia/api/villages/${id}.json`);
        const data = await res.json();
        document.getElementById('in-desa').innerHTML = data.map(v => `<option value="${v.id}" data-name="${v.name}">${v.name}</option>`).join('');
    }

    // 3. Autofill dari Laporan Warga
    function autoFill(id) {
        const r = allData.find(x => x.id == id);
        if(r) {
            document.getElementById('in-tipe').value = r.disaster_type;
            document.getElementById('in-lat').value = r.latitude;
            document.getElementById('in-lng').value = r.longitude;
            document.getElementById('in-kondisi').value = r.description;
        }
    }

    // 4. Proses Simpan
    async function saveFullAssessment() {
        const id = document.getElementById('assess-report-id').value;
        const kab = document.getElementById('in-kab');
        if(!id || !kab.value) return alert("Pilih Kejadian dan Kabupaten!");

        const payload = {
            type: document.getElementById('in-tipe').value,
            date: document.getElementById('in-tgl').value,
            time: document.getElementById('in-jam').value,
            kab: kab.options[kab.selectedIndex].getAttribute('data-name'),
            kec: document.getElementById('in-kec').options[document.getElementById('in-kec').selectedIndex]?.getAttribute('data-name') || "-",
            desa: document.getElementById('in-desa').options[document.getElementById('in-desa').selectedIndex]?.getAttribute('data-name') || "-",
            lat: parseFloat(document.getElementById('in-lat').value),
            lng: parseFloat(document.getElementById('in-lng').value),
            kondisi_mutakhir: document.getElementById('in-kondisi').value,
            upaya_penanganan: document.getElementById('in-upaya').value,
            sebaran_dampak: document.getElementById('in-sebaran').value,
            
            // Data Kuantitatif dikirim sebagai JSONB ke server.js
            kebutuhan: { 
                dana: document.getElementById('k-dana').value,
                relawan: document.getElementById('k-relawan').value,
                logistik: document.getElementById('k-logistik').value,
                peralatan: document.getElementById('k-peralatan').value,
                medis: document.getElementById('k-medis').value
            },
            dampak_manusia: { 
                meninggal: document.getElementById('d-meninggal').value || 0,
                hilang: document.getElementById('d-hilang').value || 0,
                sakit: document.getElementById('d-sakit').value || 0,
                pengungsi: document.getElementById('d-pengungsi').value || 0,
                terdampak: document.getElementById('d-terdampak').value || 0
            },
            dampak_rumah: { 
                berat: document.getElementById('r-berat').value || 0, 
                sedang: document.getElementById('r-sedang').value || 0, 
                ringan: document.getElementById('r-ringan').value || 0 
            },
            dampak_fasum: { 
                ibadah: document.getElementById('f-ibadah').value || 0, 
                sekolah: document.getElementById('f-sekolah').value || 0, 
                faskes: document.getElementById('f-faskes').value || 0, 
                kantor: document.getElementById('f-kantor').value || 0,
                pasar: document.getElementById('f-pasar').value || 0
            },
            dampak_vital: { 
                air: document.getElementById('v-air').value || 0, 
                listrik: document.getElementById('v-listrik').value || 0,
                telekom: document.getElementById('v-telekom').value || 0,
                irigasi: document.getElementById('v-irigasi').value || 0,
                jalan: document.getElementById('v-jalan').value || 0,
                spbu: document.getElementById('v-spbu').value || 0
            },
            dampak_lingkungan: {
                sawah: document.getElementById('l-sawah').value || 0,
                ternak: document.getElementById('l-ternak').value || 0
            }
        };

        try {
            const res = await fetch(`${API_URL}/api/reports/admin-create`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                alert("Assessment Profesional Berhasil Diterbitkan!");
                window.location.href = "admin_dashboard.html";
            }
        } catch (e) { alert("Gagal simpan."); }
    }

    window.onload = start;
</script>
</body>
</html>
